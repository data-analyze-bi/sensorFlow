appname = sensors
httpport = 8082
runmode = dev
autorender = false
copyrequestbody = true
EnableDocs = true
# payload 解码二进制路径
decoder_binary_path = ./binaries/licenses/current/decoder
# 单次解码最长执行时间（秒）
decoder_timeout_seconds = 10
#忽略URL
ignore_urls = /,/sensors/send

[dev]
#redis
#admin实例
redisHostAdmin = 127.0.0.1:6379
redisPwdAdmin =
redisAdminType = node

#clickhouse
ckHost = 127.0.0.1:9000
ckUsername = default
ckDatabase = sensors
ckPwd =
