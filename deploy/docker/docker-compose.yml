services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-sensorflow-dev}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sensorflow-dev}
    networks:
      - sensorflow

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sensors}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sensorflow-dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init_clickhouse.sql:/docker-entrypoint-initdb.d/init_clickhouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sensorflow

  ingestion:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ingestion
    image: sensorflow-ingestion:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SENSORFLOW_PORT:-8081}:8081"
    volumes:
      - ../../binaries/licenses:/app/binaries/licenses:ro
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - sensorflow

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile.server
    image: sensorflow-superset:local
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-sensorflow-local-development-secret-change-in-production}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-sensorflow-dev}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-support@sensorflow.site}
      SUPERSET_PUBLIC_BASE_URL: ${SUPERSET_PUBLIC_BASE_URL:-http://localhost:8088/}
      CLICKHOUSE_SQLALCHEMY_URI: ${CLICKHOUSE_SQLALCHEMY_URI:-clickhousedb://default:sensorflow-dev@clickhouse:8123/sensors}
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/pythonpath:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["/app/pythonpath/start-superset.sh"]
    networks:
      - sensorflow

volumes:
  redis_data:
  clickhouse_data:
  superset_home:

networks:
  sensorflow:
    driver: bridge
